; Vocetempo - a standalone talking bedside clock (ESP32)
; PlatformIO project configuration file.
;
; Board: DollaTek ESP32 Development Board (ESP-WROOM-32, CP2102, USB-C)
; This maps to the generic "esp32dev" board definition.
;
; ----------------------------------------------------------------------------
; This project defines multiple build "environments":
;
;   * esp32dev      -> the real Vocetempo application (src/main.cpp)
;   * i2c_scanner   -> a diagnostic that scans the I2C bus and prints any
;                      device addresses it finds (tools/i2c_scanner/)
;   * joystick_test -> prints raw KY-023 axis values + decoded direction, for
;                      confirming wiring and axis orientation
;   * native        -> host-side unit tests for the hardware-free logic (DST
;                      rules, scheduling, joystick decoding); no board needed
;
; Build/upload a specific environment with:
;   pio run -e i2c_scanner -t upload
;   pio run -e esp32dev    -t upload
;
; Run the unit tests on your computer (no hardware required):
;   pio test -e native
; ----------------------------------------------------------------------------

; A bare `pio run` / `pio run -t upload` builds the application only. Without
; this it would also try to build the diagnostics and the host test env (which
; has no main() to link), so a plain build would fail.
[platformio]
default_envs = esp32dev

; Settings shared by every environment that targets the real hardware. This is
; a plain section rather than [env] so the host test environment below does not
; inherit a board it cannot build for; hardware envs opt in with `extends`.
[esp32_base]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; Upload speed. 921600 is fast and reliable on the CP2102; if uploads
; fail, drop this to 460800 or 115200.
upload_speed = 921600

; --- Main application ---------------------------------------------------------
[env:esp32dev]
extends = esp32_base
; Compile only the real application sources, not the diagnostic tools.
build_src_filter = +<*> -<../tools/>

; Libraries are added stage-by-stage as we wire up each component.
lib_deps =
  adafruit/Adafruit GFX Library      ; Stage 2 - display
  adafruit/Adafruit SSD1306          ; Stage 2 - display (SSD1309 compatible)
  adafruit/RTClib                    ; Stage 3 - DS3231 real-time clock
  dfrobot/DFRobotDFPlayerMini        ; Stage 5 - audio
; Buttons use a small built-in debounce (no external lib needed).

; --- I2C scanner diagnostic ---------------------------------------------------
[env:i2c_scanner]
extends = esp32_base
; Compile ONLY the scanner, ignoring src/ so there is no duplicate setup()/loop().
build_src_filter = -<*> +<../tools/i2c_scanner/>

; --- Raw button/GPIO diagnostic -----------------------------------------------
[env:button_test]
extends = esp32_base
; Compile ONLY the button test, ignoring src/.
build_src_filter = -<*> +<../tools/button_test/>

; --- DFPlayer folder-addressing diagnostic ------------------------------------
[env:folder_test]
extends = esp32_base
; Compile ONLY the folder test, ignoring src/.
build_src_filter = -<*> +<../tools/folder_test/>
lib_deps = dfrobot/DFRobotDFPlayerMini

; --- OLED panel diagnostic ----------------------------------------------------
[env:oled_test]
extends = esp32_base
; Compile ONLY the OLED test, ignoring src/.
build_src_filter = -<*> +<../tools/oled_test/>
lib_deps =
  adafruit/Adafruit GFX Library
  adafruit/Adafruit SSD1306

; --- KY-023 joystick diagnostic -----------------------------------------------
; Prints raw axis values, the switch level and the decoded direction. Use it to
; confirm wiring and to settle the axis orientation after assembly.
[env:joystick_test]
extends = esp32_base
; The tool plus the shared decoder from src/, so the numbers it prints match the
; real firmware's behaviour exactly.
build_src_filter = -<*> +<Joystick.cpp> +<../tools/joystick_test/>

; --- Host unit tests ----------------------------------------------------------
; Runs on your computer with the system compiler - no ESP32, no wiring. Only the
; modules with zero hardware dependencies are compiled in: Dst (daylight saving
; rules and calendar maths), Announcer (when to speak) and Joystick (turning two
; noisy ADC readings into one direction). Everything else in src/ needs Arduino
; and is excluded.
;
;   pio test -e native
[env:native]
platform = native
build_src_filter = -<*> +<Dst.cpp> +<Announcer.cpp> +<Joystick.cpp>
build_flags = -std=gnu++11 -Wall -Iinclude
; Build the selected src/ files alongside the tests so they can be linked.
test_build_src = yes
